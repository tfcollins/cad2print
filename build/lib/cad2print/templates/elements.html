{% extends "base.html" %}
{% block content %}
<h1>Which part studio?</h1>
{% if studios %}
<ul class="list">
  {% for s in studios %}
  <li><a href="/d/{{ did }}/{{ wvm }}/{{ wvmid }}/e/{{ s.id }}/parts">{{ s.name }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">This document has no part studios. Assemblies and drawings cannot be printed directly.</p>
{% endif %}
{% endblock %}
