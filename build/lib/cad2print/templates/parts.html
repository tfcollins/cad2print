{% extends "base.html" %}
{% block content %}
<h1>Which parts, how many?</h1>
{% if parts %}
<form action="/setup" method="post">
  <input type="hidden" name="did" value="{{ did }}">
  <input type="hidden" name="wvm" value="{{ wvm }}">
  <input type="hidden" name="wvmid" value="{{ wvmid }}">
  <input type="hidden" name="eid" value="{{ eid }}">
  <table class="parts">
    <thead><tr><th></th><th>Part</th><th>Quantity</th></tr></thead>
    <tbody>
    {% for p in parts %}
    <tr>
      <td><input type="checkbox" name="part" value="{{ p.id }}" id="p-{{ p.id }}" {% if loop.length == 1 %}checked{% endif %}></td>
      <td><label for="p-{{ p.id }}">{{ p.name }}</label><input type="hidden" name="name_{{ p.id }}" value="{{ p.name }}"></td>
      <td><input type="number" name="qty_{{ p.id }}" value="1" min="1" max="50" inputmode="numeric"></td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
  <img class="preview" src="/thumb/d/{{ did }}/{{ wvm }}/{{ wvmid }}/e/{{ eid }}" alt="Part studio preview" width="300" height="170">
  <button type="submit">Choose print settings</button>
</form>
{% else %}
<p class="muted">No solid parts in this part studio. Hidden parts and surfaces are skipped.</p>
{% endif %}
{% endblock %}
