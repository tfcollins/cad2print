[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2print"
version = "0.2.1"
description = "Pull parts from Onshape, slice with OrcaSlicer, hand off to Bambu Connect"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.5", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad2print = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real orca-slicer binary"]
addopts = "-q -m \"not slow\""

[tool.ruff]
line-length = 100
target-version = "py311"
