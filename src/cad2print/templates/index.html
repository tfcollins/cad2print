{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Pick a part in Onshape.<br>Get a sliced plate in Bambu Connect.</h1>
  <form class="row" action="/documents" method="get">
    <label class="grow">
      <span>Search your documents</span>
      <input name="q" type="search" placeholder="e.g. rack mount" autofocus>
    </label>
    <button type="submit">Search</button>
  </form>
  <form class="row" action="/open-url" method="post">
    <label class="grow">
      <span>Or paste an Onshape link</span>
      <input name="url" type="url" placeholder="https://cad.onshape.com/documents/…/w/…/e/…" required>
    </label>
    <button type="submit">Open</button>
  </form>
</section>

{% if recent %}
<section>
  <h2>Recent jobs</h2>
  {% include "_job_list.html" %}
</section>
{% else %}
<p class="muted">No jobs yet. Search or paste a link to slice your first part.</p>
{% endif %}
{% endblock %}
